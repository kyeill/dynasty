name: Refresh boards and rosters

on:
  schedule:
    # GitHub cron is UTC only, so 7am Eastern is 11:00 UTC in summer and 12:00
    # in winter. The gate below lets exactly one through per Eastern day.
    #
    # Since ~2026-09-25 GitHub has delivered this account's scheduled runs four
    # to five hours late across every repo, so the honest slots were landing
    # between 11am and 3:30pm Eastern -- after the Sheet imported, which is why
    # it showed yesterday's data for weeks. The 05-07 UTC slots are the same
    # workaround sports-daily and games-history adopted on 2026-09-28: delayed
    # four or five hours one of them lands in the morning; delivered on time
    # they arrive at 1-3am Eastern and the 6am floor below throws them out. So
    # being wrong about the delay costs nothing, and if GitHub ever recovers,
    # the honest slots take over again.
    #
    # Off-the-hour minutes deliberately: exactly :00 is peak scheduling load.
    - cron: "13 5 * * *"
    - cron: "11 6 * * *"
    - cron: "7 7 * * *"
    - cron: "9 11 * * *"
    - cron: "9 12 * * *"
    - cron: "9 13 * * *"
  workflow_dispatch:

permissions:
  contents: write        # needed to commit the refreshed CSVs back

concurrency:
  group: dynasty-refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)
          built=$(cat output/_last_refresh.txt 2>/dev/null || echo none)

          # The gate is "has today been done yet", NOT "is it 7am". GitHub
          # does not deliver scheduled runs on time -- on 2026-08-28 all three
          # slots arrived together at 21:50 UTC, roughly ten hours late. An
          # hour-based gate threw every one of them away, so the daily refresh
          # had never actually fired on its own; every green run to that point
          # was a manual dispatch.
          #
          # Keyed on the Eastern date, so whichever slot arrives first that day
          # does the work and the rest skip. Late delivery costs freshness, not
          # the refresh itself.
          # A 6am Eastern floor, which is NOT the old "must be exactly 7am"
          # gate -- that one discarded every late-delivered run and meant the
          # schedule never fired at all. This only rejects absurdly early
          # arrivals, which matter because the sources update through the
          # morning: a build at 2am would mark the day done with yesterday's
          # numbers and no later slot would correct it.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            reason="manual run"; go=yes
          elif [ "$built" = "$today" ]; then
            reason="already refreshed for $today"; go=no
          elif [ "$hour" \< "06" ]; then
            reason="only $hour:00 Eastern -- too early, sources still stale"; go=no
          else
            reason="nothing refreshed for $today yet (Eastern hour $hour)"; go=yes
          fi

          if [ "$go" = "yes" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "refreshing ($reason)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "skipping ($reason)"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Without this the split cache is defeated and every run refetches the
      # lot -- Yahoo alone is 45 paginated requests for names that barely
      # change. Keyed by week so it expires in step with cache_hours: 168.
      - name: Restore the page cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: dynasty-cache-${{ github.run_id }}
          restore-keys: |
            dynasty-cache-

      - name: Refresh the boards
        id: boards
        run: python rankings.py --sport all

      # One sport failing must not throw away the others. rankings.py already
      # isolates them -- it returns non-zero but still writes the boards that
      # worked -- so these run anyway and the run stays red for the one that
      # did not. Without this, an NBA source going quiet silently discarded
      # fresh NFL and MLB boards.
      - name: Refresh the rosters
        if: ${{ !cancelled() }}
        run: python rosters.py --sport all

      # Runs BEFORE the commit, so `git show HEAD:` is still yesterday's board
      # to compare against. Failing here does not stop the commit -- a degraded
      # board is still worth publishing, it just should not be published
      # quietly. The point is only to turn the run red, because a red run is
      # the one thing in this pipeline that reaches an inbox.
      - name: Check the boards are healthy
        if: ${{ !cancelled() }}
        run: python check_health.py

      - name: Commit whatever changed
        if: ${{ !cancelled() }}
        run: |
          # Only stamp the day as done if the boards actually built. The gate
          # reads this file, so stamping after a failure would mark the day
          # complete and stop the remaining slots from retrying.
          if [ "${{ steps.boards.outcome }}" = "success" ]; then
            TZ=America/New_York date +%F > output/_last_refresh.txt
          else
            echo "boards failed -- leaving _last_refresh.txt alone so a later slot retries"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # lastgood/ matters as much as output/: it is the fallback that keeps
          # a board alive when a source goes dark, and it is banked during the
          # run. Left uncommitted, every Actions run would start with no
          # fallback and the whole mechanism would be local-only.
          git add -A output lastgood
          if git diff --cached --quiet; then
            echo "nothing changed today"
          else
            # [skip ci] matters: without it this push retriggers the workflow,
            # which commits again, forever.
            git commit -m "Refresh: $(TZ=America/New_York date +%F) [skip ci]"
            git push
          fi
